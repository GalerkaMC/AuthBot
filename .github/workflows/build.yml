name: build

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
  workflow_call:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: | 
          python3 -m pip install uv
          python3 -m uv pip install -r requirements.txt --dry-run
