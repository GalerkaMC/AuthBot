version: "3.9"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.telegram
      - .env.config
    network_mode: "host"
    restart: unless-stopped
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
